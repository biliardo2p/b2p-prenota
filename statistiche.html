<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Statistiche · Prenota 2P</title>
<link rel="icon" href="img/logo.png">
<meta name="theme-color" content="#070d18">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Oswald:wght@600;700&display=swap">
<link rel="stylesheet" href="css/prenota.css?v=2026112403">
<link rel="stylesheet" href="css/statistiche.css?v=2026112403">
</head>
<body class="pagina-stat">
<header class="testata">
  <img src="img/logo-96.png" alt="" width="44" height="44">
  <div class="titoli"><div class="titolo">Statistiche biliardi</div><div class="sotto" id="periodo-nome"></div></div>
  <a class="sotto destra" href="./">← Torna all'app</a>
</header>

<main class="wrap largo">
  <p id="negato" class="avviso chiuso" hidden>Questa pagina è riservata ai soci. <a href="./">Accedi dall'app</a> con la tua utenza.</p>

  <div id="stat" hidden>
    <div class="comandi">
      <div class="segmenti" role="group" aria-label="Di chi" id="vista">
        <button data-vista="circolo" class="attivo">Circolo</button>
        <button data-vista="mie">Le mie</button>
      </div>
      <div class="segmenti" role="group" aria-label="Periodo" id="periodi">
        <button data-tipo="settimana">Settimana</button>
        <button data-tipo="mese" class="attivo">Mese</button>
        <button data-tipo="anno">Anno</button>
      </div>
      <div class="naviga">
        <button class="btn piccolo" id="prec" aria-label="Periodo precedente">◀</button>
        <b id="periodo-etichetta"></b>
        <button class="btn piccolo" id="succ" aria-label="Periodo successivo">▶</button>
      </div>
      <button class="btn piccolo" id="csv">Scarica CSV (Excel)</button>
    </div>
    <p id="carico" class="meta">Carico i dati…</p>

    <section class="tiles" id="tiles"></section>

    <section class="carta">
      <h2><span id="titolo-andamento">Ore prenotate</span> <span class="meta" id="andamento-unita"></span></h2>
      <div id="andamento" class="barre"></div>
    </section>

    <div class="due">
      <section class="carta">
        <h2 id="titolo-biliardo">Per biliardo</h2>
        <div id="per-biliardo"></div>
      </section>
      <section class="carta">
        <h2>Tipo di partita</h2>
        <div id="per-tipo"></div>
      </section>
    </div>

    <section class="carta">
      <h2 id="titolo-mappa">Quando si gioca</h2>
      <p class="meta" id="nota-mappa"></p>
      <div id="mappa" class="mappa-box"></div>
    </section>

    <!-- solo nella vista «Le mie»: nella vista del circolo non compare nessun nome -->
    <div class="due" id="solo-mie" hidden>
      <section class="carta">
        <h2>I miei avversari</h2>
        <div id="top"></div>
      </section>
      <section class="carta">
        <h2>Le mie richieste «Cerco avversario»</h2>
        <div id="cerco"></div>
      </section>
    </div>
    <p class="meta" id="nota-fondo"></p>
  </div>
</main>
<div id="suggerimento" role="tooltip" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="js/config.js?v=2026112403"></script>
<script src="js/util.js?v=2026112403"></script>
<script src="js/dati.js?v=2026112403"></script>
<script src="js/statistiche.js?v=2026112403"></script>
</body>
</html>
